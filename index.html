
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div>
            <h1>Sticky Notes</h1>
            <p>Capture your thoughts.</p>
        </div>
        <button id="add-note">+ New Note</button>
    </header>

    <main>
        <input id="search" type="text" placeholder="Search your notes...">
        <div id="notes-container" class="notes-grid"></div>
        <p id="empty-message">No notes yet. Create your first note!</p>
    </main>

    <script src="renderer.js"></script>
</body>
</html>
